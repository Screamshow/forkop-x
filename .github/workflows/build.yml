name: Build packages
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build and publish
        required: true
        type: string
      publish_release:
        description: Publish the built packages as a GitHub release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: forkop-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preparation:
    name: Setup build version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      commitish: ${{ steps.version.outputs.commitish }}
      release_notes: ${{ steps.version.outputs.release_notes }}
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0
      - id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.release_tag || '' }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(git describe --tags --exact-match 2>/dev/null || true)
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-canary\.[0-9]+)?$ ]]; then
            echo "Release version must use x.y.z or x.y.z-canary.N format, got: ${VERSION:-<empty>}" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commitish=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Use the authored release description without adding build metadata.
          RAW_RELEASE_NOTES=""
          if [ -f "docs/releases/$VERSION.md" ]; then
            RAW_RELEASE_NOTES="$(cat "docs/releases/$VERSION.md")"
          else
            RAW_RELEASE_NOTES="$(git tag -l --format='%(contents)' "$VERSION")"
          fi
          export RAW_RELEASE_NOTES
          NORMALIZED_RELEASE_NOTES="$(node <<'NODE'
          process.stdout.write(process.env.RAW_RELEASE_NOTES.replace('\\n', '\n'));
          NODE
          )"
          {
            echo 'release_notes<<FORKOP_RELEASE_NOTES_EOF'
            printf '%s\n' "$NORMALIZED_RELEASE_NOTES"
            echo 'FORKOP_RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build Forkop release packages
    runs-on: ubuntu-24.04
    needs: preparation
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Install build dependencies
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Chrome is preinstalled on GitHub runners but is not a Forkop build
          # dependency. Exclude only its third-party apt source so a transient
          # Chrome index mismatch cannot block the release build.
          for source in /etc/apt/sources.list.d/*; do
            [ -f "$source" ] && grep -q 'dl.google.com/linux/chrome' "$source" && sudo rm -f "$source"
          done
          # Avoid the runner's mirror selector retaining an unavailable Azure
          # mirror across retries. Keep Ubuntu's suites and signing settings.
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            [ -f "$source" ] || continue
            sudo sed -i \
              -e 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|mirror+file:/etc/apt/apt-mirrors-security.txt|https://security.ubuntu.com/ubuntu|g' \
              -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
          done
          sudo apt-get -o Acquire::Retries=2 update
          sudo apt-get install -y build-essential curl fakeroot file gawk git patch perl tar unzip util-linux xz-utils zstd

      - name: Build release artifacts
        shell: bash
        run: |
          VERSION="${{ needs.preparation.outputs.version }}"
          ./build.sh "$VERSION" "$PWD/filtered-bin/release"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: release-files-${{ needs.preparation.outputs.version }}
          path: ./filtered-bin/release/*
          retention-days: 1
          if-no-files-found: error

  release:
    name: Create Release
    if: github.event_name == 'push' || inputs.publish_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    needs:
      - preparation
      - build
    steps:
      - uses: actions/checkout@v5.0.0
      - name: Create release dir
        run: mkdir -p ./filtered-bin/release

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-files-${{ needs.preparation.outputs.version }}
          path: ./filtered-bin/release

      - name: Preserve published signed release
        id: release_guard
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preparation.outputs.version }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" > releases.json
          if jq -e --arg tag "$RELEASE_TAG" '.[] | select(.tag_name == $tag and .draft == false)' releases.json >/dev/null; then
            echo 'mutable=false' >> "$GITHUB_OUTPUT"
            echo 'Published release is immutable; preserving signed assets.'
          else
            echo 'mutable=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Release
        if: steps.release_guard.outputs.mutable == 'true'
        uses: softprops/action-gh-release@v2.4.0
        with:
          files: ./filtered-bin/release/*.*
          # scripts/release.py signs APK on the existing mirror, verifies the
          # uploaded assets and only then publishes this draft.
          draft: true
          prerelease: ${{ contains(needs.preparation.outputs.version, '-canary.') }}
          make_latest: ${{ !contains(needs.preparation.outputs.version, '-canary.') }}
          name: ${{ needs.preparation.outputs.version }}
          body: ${{ needs.preparation.outputs.release_notes }}
          tag_name: ${{ needs.preparation.outputs.version }}
          target_commitish: ${{ needs.preparation.outputs.commitish }}
